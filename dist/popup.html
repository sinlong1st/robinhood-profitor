<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Robinhood Profit Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      color: #111;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    .row {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
    }
    .hint {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .ok {
      color: #0a7a32;
      font-weight: 600;
      margin-top: 10px;
      font-size: 12px;
    }
    button {
      padding: 8px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Robinhood Profit Helper</h1>

  <div class="row">
    <label for="taxRate">Tax estimate % (optional)</label>
    <input id="taxRate" type="number" min="0" max="100" step="0.1" placeholder="Example: 20" />
  </div>

  <div class="row">
    <label for="slippage">Slippage / fee buffer per trade $ (optional)</label>
    <input id="slippage" type="number" min="0" step="0.01" placeholder="Example: 1.00" />
  </div>

  <div class="row">
    <button id="saveBtn" type="button">Save</button>
  </div>

  <div class="ok" id="status"></div>

  <p class="hint">
    This is an MVP. It uses page text heuristics, so you may need to tweak selectors later if Robinhood changes their UI.
  </p>

  <script type="module" src="./popup.js"></script>
</body>
</html>
